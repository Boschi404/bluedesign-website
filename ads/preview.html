<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>BlueDesign — Creatività ADS Autunno 2026</title>
<style>
  :root { --night:#0A0A0F; --gold:#C9A962; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { background:#111; color:#eee; font-family: 'Montserrat', 'Segoe UI', sans-serif; padding:24px; }
  h1 { font-weight:300; letter-spacing:.2em; text-transform:uppercase; font-size:14px; color:var(--gold); margin-bottom:4px;}
  .hint { color:#888; font-size:12px; margin-bottom:28px; max-width:900px; line-height:1.6;}
  .hint b { color:#ccc; }
  .ad-block { margin-bottom:48px; }
  .ad-head { display:flex; align-items:baseline; gap:12px; margin-bottom:12px; }
  .ad-title { font-size:15px; font-weight:600; color:#fff; }
  .ad-id { font-family: monospace; font-size:11px; color:var(--gold); background:#1c1c24; padding:2px 8px; border-radius:4px;}
  .formats { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start;}
  .fmt { position:relative; }
  .fmt-label { font-size:10px; color:#777; letter-spacing:.1em; margin-bottom:6px; text-transform:uppercase;}

  /* ===== FRAME CREATIVE (scala via transform) ===== */
  .creative {
    width:1080px; height:1080px;
    background:var(--night);
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    transform-origin: top left;
  }
  .creative.story { width:1080px; height:1920px; }
  .creative.wide { width:1200px; height:628px; flex-direction:row; }
  .creative.wide-sq { width:1200px; height:1200px; }

  /* foto: copre sempre il frame intero, poi overlay */
  .photo { position:absolute; inset:0; background-size:cover; background-position:center; }
  .veil { position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(10,10,15,.55) 0%, rgba(10,10,15,.25) 35%, rgba(10,10,15,.88) 72%, rgba(10,10,15,.97) 100%); }
  .wide .veil { background: linear-gradient(90deg, rgba(10,10,15,.96) 0%, rgba(10,10,15,.82) 42%, rgba(10,10,15,.25) 75%, rgba(10,10,15,.15) 100%); }

  .content { position:absolute; inset:0; padding:64px; display:flex; flex-direction:column; justify-content:flex-end; }
  .wide .content { justify-content:center; max-width:62%; padding:56px; }
  .story .content { padding:80px; }

  .brandline { display:flex; align-items:center; justify-content:flex-start; margin-bottom:auto; }
  .content > .brandline { position:absolute; top:56px; left:64px; right:300px; }
  .wide .content > .brandline { top:48px; left:56px; right:220px; }
  .story .content > .brandline { top:72px; left:80px; right:340px; }
  .brandline img.logo { height:56px; width:auto; }
  .story .brandline img.logo { height:72px; }
  .site { color:var(--gold); font-size:22px; letter-spacing:.14em; font-weight:600; }
  .story .site { font-size:28px; }

  .kicker { color:var(--gold); font-size:24px; letter-spacing:.3em; font-weight:600; margin-bottom:20px; text-transform: uppercase;}
  .story .kicker { font-size:30px; margin-bottom:28px;}
  .wide .kicker { font-size:19px; margin-bottom:14px;}

  .top-line { color:#EDEDEF; font-size:40px; font-weight:300; line-height:1.25; margin-bottom:18px; }
  .story .top-line { font-size:52px; }
  .wide .top-line { font-size:30px; margin-bottom:10px;}

  .main-line { color:#fff; font-size:74px; font-weight:900; line-height:1.04; letter-spacing:-.01em; text-transform:uppercase; }
  .main-line .gold { color:var(--gold); }
  .story .main-line { font-size:92px; }
  .wide .main-line { font-size:46px; }

  .extra-line { display:inline-block; margin-top:22px; background:var(--gold); color:var(--night); font-weight:800; font-size:44px; padding:10px 26px; }
  .story .extra-line { font-size:54px; }
  .wide .extra-line { font-size:30px; margin-top:14px;}

  .sub { color:#C9C9D0; font-size:27px; font-weight:400; margin-top:24px; line-height:1.45; }
  .story .sub { font-size:33px; }
  .wide .sub { font-size:19px; margin-top:12px;}

  .bottombar { display:flex; align-items:center; gap:28px; margin-top:36px; }
  .story .bottombar { margin-top:44px; }
  .wide .bottombar { margin-top:20px; }
  .cta { background:var(--gold); color:var(--night); font-weight:800; font-size:28px; padding:20px 44px; letter-spacing:.02em; }
  .wide .cta { font-size:20px; padding:14px 30px; }
  .phone { color:#fff; font-size:28px; font-weight:600; letter-spacing:.04em;}
  .wide .phone { font-size:20px; }
  .partner { margin-left:auto; height:64px; }
  .wide .partner { height:44px; }

  .badge {
    position:absolute; top:56px; right:64px;
    background:var(--gold); color:var(--night);
    font-weight:900; font-size:30px; letter-spacing:.08em;
    padding:16px 30px; text-transform:uppercase;
  }
  .story .badge { top:72px; right:80px; font-size:36px;}
  .wide .badge { top:48px; right:56px; font-size:22px; padding:12px 22px;}

  .gold-rule { width:120px; height:4px; background:var(--gold); margin-bottom:28px; }
  .wide .gold-rule { width:90px; height:3px; margin-bottom:18px;}
</style>
</head>
<body>
<h1>BlueDesign — Creatività ADS · Autunno 2026</h1>
<p class="hint">
  Ogni blocco = 1 annuncio nei 4 formati (Meta feed 1:1, Meta story 9:16, Google display 1.91:1, Google square 1:1).<br>
  <b>Modifica i testi/foto in <code>ads/config.js</code></b> e ricarica: tutto si aggiorna. <b>Esporta i PNG</b> aprendo <code>ads/export.html</code>.
</p>
<div id="root"></div>

<script src="config.js"></script>
<script>
const C = window.ADS_CONFIG;
const FMT = [
  { key: "meta-square", label: "Meta Feed · 1080×1080", cls: "" },
  { key: "meta-story",  label: "Meta Story · 1080×1920", cls: "story" },
  { key: "google-large",label: "Google Display · 1200×628", cls: "wide" },
  { key: "google-sq",   label: "Google Square · 1200×1200", cls: "wide-sq" },
];

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function mainLineHTML(t){
  // text prima di ** è bianco, tra ** è oro: "I top in gres **TE LI REGALIAMO**"
  return esc(t).split("**").map((part,i)=> i%2 ? `<span class="gold">${part}</span>` : part).join("");
}

function creativeHTML(ad, cls){
  const p = C.palette;
  return `
  <div class="creative ${cls}">
    <div class="photo" style="background-image:url('${ad.photo}'); background-position:${ad.photoPos}"></div>
    <div class="veil"></div>
    <div class="badge">${esc(ad.badge)}</div>
    <div class="content">
      <div class="brandline">
        <img class="logo" src="${C.brand.logo}" alt="${C.brand.name}">
      </div>
      <div style="flex:1"></div>
      <div class="kicker">${esc(ad.kicker)}</div>
      <div class="top-line">${esc(ad.lines.top)}</div>
      <div class="main-line">${mainLineHTML(ad.lines.main)}</div>
      ${ad.lines.extra ? `<div class="extra-line">${esc(ad.lines.extra)}</div>` : ""}
      <div class="sub">${esc(ad.sub)}</div>
      <div class="bottombar">
        <span class="cta">${esc(C.brand.cta)} →</span>
        <span class="phone">${esc(C.brand.phone)}</span>
        ${ad.partnerLogo ? `<img class="partner" src="${ad.partnerLogo}" alt="partner">` : ""}
      </div>
    </div>
  </div>`;
}

document.getElementById("root").innerHTML = C.ads.map(ad => `
  <div class="ad-block" id="${ad.id}">
    <div class="ad-head">
      <span class="ad-id">${ad.id}</span>
      <span class="ad-title">${esc(ad.campaign)}</span>
    </div>
    <div class="formats">
      ${FMT.map(f => `
        <div class="fmt">
          <div class="fmt-label">${f.label}</div>
          <div class="fmt-frame" data-ad="${ad.id}" data-fmt="${f.key}" style="zoom:${f.cls==='story'?0.22:(f.cls==='wide'?0.36:0.32)}">
            ${creativeHTML(ad, f.cls)}
          </div>
        </div>`).join("")}
    </div>
  </div>`).join("");
</script>
</body>
</html>
